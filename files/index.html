<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaled</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Khaled — personal page">

<!-- Fonts: Bricolage Grotesque for the display name, Inter for everything else -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Soft blurred gradient blobs that drift slowly. Purely decorative. -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grain"></div>
    <span class="blob blob--blue"></span>
    <span class="blob blob--violet"></span>
    <span class="blob blob--silver"></span>
    <div class="bg__vignette"></div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="stage">
    <div class="card-stack">

      <!-- ---------- Identity ---------- -->
      <section class="identity" data-reveal>
        <h1 class="name">
          <!-- EDIT HERE: change the displayed name -->
          <span class="name__sheen">Khaled</span>
        </h1>

        <p class="tagline"> </p>
      </section>

      <!-- ---------- Music Player ---------- -->
      <section class="player glass" data-reveal aria-label="Music player">
        <div class="player__row">

          <!-- EDIT HERE: replace album-art.jpg with your own cover image -->
          <div class="player__art" id="playerArt">
            <img src="album-art.svg" alt="Album cover for the current track" id="artImage">
            <div class="player__art-sheen"></div>
          </div>

          <div class="player__meta">
            <!-- EDIT HERE: song title -->
            <p class="player__title" id="trackTitle">LALALALALALALA</p>
            <!-- EDIT HERE: artist name -->
            <p class="player__artist" id="trackArtist">Khaled</p>
          </div>

          <button class="icon-btn icon-btn--volume" id="volumeBtn" aria-label="Mute volume" aria-pressed="false">
            <svg viewBox="0 0 24 24" class="icon" id="volumeIcon" aria-hidden="true">
              <path d="M4 9.5v5a1 1 0 0 0 1 1h3.2l4.1 3.4a.6.6 0 0 0 1-.46V5.56a.6.6 0 0 0-1-.46L8.2 8.5H5a1 1 0 0 0-1 1Z"/>
              <path class="wave wave--1" d="M16.2 8.8a5 5 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path class="wave wave--2" d="M18.6 6.4a8.3 8.3 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- volume slider (revealed on tap/click of the volume icon) -->
        <div class="volume-panel" id="volumePanel">
          <input type="range" min="0" max="100" value="70" id="volumeSlider" class="volume-slider" aria-label="Volume">
        </div>

        <div class="player__progress-row">
          <span class="player__time" id="currentTime" aria-hidden="true">0:00</span>
          <div class="progress" id="progressBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="progress__track">
              <div class="progress__fill" id="progressFill"></div>
              <div class="progress__handle" id="progressHandle"></div>
            </div>
          </div>
          <span class="player__time" id="durationTime" aria-hidden="true">0:00</span>
        </div>

        <div class="player__controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">
            <svg viewBox="0 0 24 24" class="icon"><path d="M7 6a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V7a1 1 0 0 1 1-1Zm12.7.4a1 1 0 0 1 .3.7v9.8a1 1 0 0 1-1.55.83l-7.7-4.9a1 1 0 0 1 0-1.66l7.7-4.9a1 1 0 0 1 1.25.13Z"/></svg>
          </button>

          <button class="play-btn" id="playBtn" aria-label="Play" aria-pressed="false">
            <span class="play-btn__glow" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" class="icon icon--play" id="playIcon"><path d="M8.6 5.6a1 1 0 0 1 1.5-.87l9.3 6.4a1 1 0 0 1 0 1.74l-9.3 6.4a1 1 0 0 1-1.5-.87Z"/></svg>
            <svg viewBox="0 0 24 24" class="icon icon--pause" id="pauseIcon" hidden><path d="M7.5 5a1.5 1.5 0 0 1 1.5 1.5v11a1.5 1.5 0 0 1-3 0v-11A1.5 1.5 0 0 1 7.5 5Zm9 0a1.5 1.5 0 0 1 1.5 1.5v11a1.5 1.5 0 0 1-3 0v-11A1.5 1.5 0 0 1 16.5 5Z"/></svg>
          </button>

          <button class="ctrl-btn" id="nextBtn" aria-label="Next track">
            <svg viewBox="0 0 24 24" class="icon"><path d="M17 6a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V7a1 1 0 0 1 1-1ZM4.3 6.4a1 1 0 0 1 1.25-.13l7.7 4.9a1 1 0 0 1 0 1.66l-7.7 4.9A1 1 0 0 1 4 16.9V7.1a1 1 0 0 1 .3-.7Z"/></svg>
          </button>
        </div>

        <!-- EDIT HERE: swap track.mp3 for your own audio file -->
        <audio id="audio" preload="metadata" src="track.mp3"></audio>
      </section>

      <!-- ---------- Telegram Connect ---------- -->
      <a
        class="telegram-btn glass"
        id="telegramBtn"
        data-reveal
        href="https://t.me/xio1337"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Telegram, opens in a new tab"
      >
        <!-- EDIT HERE: replace YOUR_USERNAME above with your Telegram handle -->
        <span class="telegram-btn__sheen" aria-hidden="true"></span>
        <svg viewBox="0 0 240 240" class="icon telegram-icon" aria-hidden="true">
          <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0Z" fill="none"/>
          <path d="M54.9 118.3c37.9-16.5 63.2-27.4 75.9-32.6 36.2-15 43.7-17.6 48.6-17.7 1.1 0 3.5.2 5 1.5 1.3 1.1 1.7 2.5 1.9 3.6.2 1 .4 3.4.2 5.2-2 20.9-10.5 71.6-14.9 95-1.8 9.9-5.5 13.2-9 13.6-7.6.7-13.4-5-20.8-9.9-11.6-7.6-18.1-12.3-29.4-19.8-13-8.5-4.6-13.2 2.8-20.9 2-2 35.9-32.9 36.5-35.7.1-.3.2-1.6-.6-2.3-.8-.7-2-.5-2.8-.3-1.2.3-20.6 13.1-58.2 38.5-5.5 3.8-10.5 5.6-15 5.5-4.9-.1-14.4-2.8-21.4-5.1-8.6-2.9-15.5-4.4-14.9-9.3.3-2.5 3.8-5.1 10.4-7.7Z" fill="currentColor"/>
        </svg>
        <span class="telegram-btn__label"> Telegram </span>
        <svg viewBox="0 0 24 24" class="icon telegram-arrow" aria-hidden="true">
          <path d="M8 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

    </div>

    <p class="footnote" data-reveal> <span id=""></span></p>
  </main>

<script src="script.js"></script>
</body>
</html>
