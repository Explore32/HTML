<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaled</title>
<link rel="icon" type="image/svg+xml" href="ASSETS/favicon.png">
<style>
:root{
  --bg:#0a0a0a;
  --panel:#121212;
  --ink:#E5E5E5;
  --ink-dim:#9A9A9A;
  --silver:#C0C0C0;
  --silver-light:#E5E5E5;
  --silver-dim:#A9A9A9;
  --silver-metallic:#BFC5CA;
  --silver-highlight:#D6D6D6;
  --silver-hover:#F2F2F2;
  --teal:#3fa89a;
  --red:#8a2f22;
  --line:#3D3D3D;
  --grid: 8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{
  font-family:'IBM Plex Mono','Courier New',monospace;
  font-size:15px;
  line-height:1.6;
  cursor:none;
  overflow-x:hidden;
  position:relative;
}
@media (pointer:coarse){
  body{cursor:auto;}
  .cursor-dot,.cursor-ring{display:none !important;}
}
h1,h2,h3{
  font-family:'Cinzel','Trajan Pro',serif;
  font-weight:600;
  letter-spacing:.06em;
  margin:0;
  color:var(--silver);
}
a{color:var(--teal);text-decoration:none;}
a:hover{color:var(--silver-hover);}

/* ---------- background collage (css/svg only, original) ---------- */
.bg-collage{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(191,197,202,.08), transparent 40%),
    radial-gradient(ellipse at 80% 30%, rgba(63,168,154,.06), transparent 45%),
    radial-gradient(ellipse at 50% 90%, rgba(138,47,34,.10), transparent 50%),
    repeating-linear-gradient(115deg, #141414 0px, #141414 2px, #0e0e0e 2px, #0e0e0e 4px);
  opacity:.9;
}
.bg-motifs{position:fixed;inset:0;z-index:0;opacity:.14;pointer-events:none;}
.bg-motifs svg{position:absolute;}

/* CRT scanlines + grain */
.crt::before{
  content:"";position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,.18) 3px, rgba(0,0,0,0) 4px
  );
  mix-blend-mode:multiply;
}
.crt::after{
  content:"";position:fixed;inset:0;z-index:6;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  opacity:.5;
  animation:grain 1.2s steps(3) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  33%{transform:translate(-1%,1%)}
  66%{transform:translate(1%,-1%)}
  100%{transform:translate(0,0)}
}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
  box-shadow:inset 0 0 220px rgba(0,0,0,.85);}

/* ---------- custom cursor ---------- */
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;}
.cursor-dot{width:4px;height:4px;background:var(--silver);}
.cursor-ring{width:22px;height:22px;border:1px solid var(--silver-dim);transition:transform .12s ease, border-color .12s ease;}
.cursor-ring.active{border-color:var(--silver-hover);transform:scale(1.4);}

/* ---------- layout shell ---------- */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
.panel{
  border:1px solid var(--line);
  background:rgba(10,10,10,.82);
  margin-bottom:22px;
  position:relative;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;
  border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);
  font-family:'IBM Plex Mono',monospace;
}
.panel-body{padding:16px;}
.tag{color:var(--ink-dim);font-size:11px;}

/* ---------- header (BIOS style) ---------- */
.topbar{
  display:flex;justify-content:flex-start;align-items:center;
  border-top:1px solid #000;border-bottom:1px solid #000;
  background:#ff1a1a;
  padding:5px 16px;margin-bottom:22px;
}
.topbar .title{
  font-family:'IBM Plex Mono','Courier New',monospace;
  color:#fff;font-size:12px;letter-spacing:.08em;font-weight:400;
}

/* ---------- hero / profile ---------- */
.grid-2{display:grid;grid-template-columns:1fr .75fr;gap:22px;align-items:start;}
.hero-art{
  aspect-ratio:4/3;border:1px solid var(--silver-dim);
  background:
    radial-gradient(circle at 50% 42%, rgba(191,197,202,.35), transparent 55%),
    linear-gradient(160deg,#242424,#0c0c0c 70%);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.hero-art .external-art{width:100%;height:100%;object-fit:cover;display:block;filter:drop-shadow(0 0 6px rgba(191,197,202,.3));}
.hero-art .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.25) 3px 4px);}
.field-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.field-row span:first-child{color:var(--ink-dim);}
.field-row span:last-child{color:var(--ink);}
.field-row.accent span:last-child{color:var(--silver);}


/* ---------- nav ---------- */
.nav-btn{
  border:1px solid var(--silver-dim);background:transparent;color:var(--silver);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  padding:6px 12px;cursor:pointer;
}
.nav-panel{
  position:fixed;top:0;right:0;height:100%;width:min(280px,80vw);
  background:#0c0c0c;border-left:1px solid var(--silver-dim);z-index:50;
  transform:translateX(100%);transition:transform .25s ease;padding:16px;
}
.nav-panel.open{transform:translateX(0);}
.nav-panel a{display:block;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);}
.nav-panel a:hover{color:var(--silver-hover);}
.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none;}
.nav-overlay.open{display:block;}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:900px){
  .grid-2{grid-template-columns:1fr;}
}
@media (max-width:768px){
  body{cursor:auto;}
  .cursor-dot,.cursor-ring{display:none;}
}
@media (max-width:480px){
  body{font-size:14px;}
  .panel-body{padding:12px;}
  h1,h2,h3{letter-spacing:.03em;}
  .field-row{font-size:12px;}
}

.bg-image{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:url("ASSETS/background.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:.18;
  mix-blend-mode:screen;
}
.asset-preload{display:none!important;}
</style>

</head>

<div class="crt">
<img src="ASSETS/hero.jpg" alt="" class="asset-preload" aria-hidden="true">
<div class="wrap">

  <!-- nav side panel (retained for in-page anchors, no longer opened from header) -->
  <div class="nav-overlay" id="navOverlay"></div>
  <div class="nav-panel" id="navPanel">

    <div class="panel">

        <div class="field-row"><span>Name</span><span> Khaled </span></div>
        <div class="field-row accent"><span>Skills</span><span> Hacker &middot; Researchr &middot; Social Engineering</span></div>
        <div class="field-row"><span>Base</span><span>Israel</span></div>
        <div class="field-row"><span>Origin</span><span>Cairo , EG</span></div>
        <div class="field-row"><span>Contact</span><span><a href="mailto:kh4liddx@icloud.com">kh4liddx@icloud.com</a></span></div>

</div>

<script>
/* year (footer removed; guard in case markup changes) */
var yearEl = document.getElementById('year');
if(yearEl){ yearEl.textContent = new Date().getFullYear(); }

/* custom cursor, desktop / mouse only */
(function(){
  var isTouch = window.matchMedia('(pointer:coarse)').matches;
  if(isTouch) return;
  var dot = document.getElementById('cdot');
  var ring = document.getElementById('cring');
  var rx=0, ry=0, x=0, y=0;
  window.addEventListener('mousemove', function(e){
    x = e.clientX; y = e.clientY;
    dot.style.transform = 'translate(' + (x-2) + 'px,' + (y-2) + 'px)';
  });
  function loop(){
    rx += (x-rx)*0.18; ry += (y-ry)*0.18;
    ring.style.transform = 'translate(' + (rx-11) + 'px,' + (ry-11) + 'px)';
    requestAnimationFrame(loop);
  }
  loop();
  document.querySelectorAll('a,button,.card').forEach(function(el){
    el.addEventListener('mouseenter', function(){ ring.classList.add('active'); });
    el.addEventListener('mouseleave', function(){ ring.classList.remove('active'); });
  });
})();

/* tap-to-reveal for touch devices on cards */
document.querySelectorAll('.card').forEach(function(card){
  card.addEventListener('click', function(e){
    var isTouch = window.matchMedia('(pointer:coarse)').matches;
    if(!isTouch) return;
    document.querySelectorAll('.card.tap').forEach(function(c){ if(c!==card) c.classList.remove('tap'); });
    card.classList.toggle('tap');
  });
});

/* nav panel (button removed from header; overlay/panel kept but no longer triggered) */
var navToggle = document.getElementById('navToggle');
var navPanel = document.getElementById('navPanel');
var navOverlay = document.getElementById('navOverlay');
function closeNav(){ navPanel.classList.remove('open'); navOverlay.classList.remove('open'); }
if(navToggle){
  navToggle.addEventListener('click', function(){
    navPanel.classList.toggle('open'); navOverlay.classList.toggle('open');
  });
}
navOverlay.addEventListener('click', closeNav);
navPanel.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeNav); });

/* background motif field: local editable image assets */
(function(){
  var layer = document.getElementById('motifLayer');
  var isSmall = window.innerWidth < 768;
  var count = isSmall ? 8 : 18;
  var images = ["motif_ankh.jpg","motif_eye.jpg","motif_pyramid.jpg"];

  for(var i=0;i<count;i++){
    var d = document.createElement('div');
    var img = document.createElement('img');
    img.src = 'ASSETS/' + images[i % images.length];
    img.alt = "";
    img.loading = "lazy";
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "contain";
    d.style.position = "absolute";
    d.style.width = (40 + Math.random()*60) + "px";
    d.style.height = d.style.width;
    d.style.left = (Math.random()*100) + "%";
    d.style.top = (Math.random()*100) + "%";
    d.style.transform = "rotate("+(Math.random()*40-20)+"deg)";
    layer.appendChild(d);
  }
})();
</script>


<script>
document.querySelectorAll('[data-port]').forEach(function(a){
  var key = a.getAttribute('data-port');
  if (PORTS[key]) {

    if (PORTS[key] !== "#" && !PORTS[key].startsWith("mailto:")) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";

});
